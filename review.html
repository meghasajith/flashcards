<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Review {{ set_name }}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <script defer src="{{ url_for('static', filename='script.js') }}"></script>
</head>
<body>
    <div class="container">
        <h2>Reviewing: {{ set_name }}</h2>
        {% if cards %}
            <div class="flashcard" id="flashcard">
                <p id="question">{{ cards[0].question }}</p>
                <p id="answer" style="display:none;">{{ cards[0].answer }}</p>
                <button onclick="toggleAnswer()" class="btn">Show Answer</button>
            </div>
        {% else %}
            <p>No flashcards to review in this set.</p>
        {% endif %}
        <a href="{{ url_for('index') }}" class="btn">Back to Home</a>
    </div>
</body>
</html>
